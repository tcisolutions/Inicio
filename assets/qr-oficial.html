<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Oficial - Technical Center Morelia</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:Inter,Arial,sans-serif;
    background:#020617;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:30px;
}
.card{
    width:380px;
    background:linear-gradient(180deg,#0B1120,#07121F);
    border-radius:28px;
    padding:30px;
    text-align:center;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 25px 60px rgba(0,0,0,.5);
}
.logo{
    width:95px;
    height:95px;
    border-radius:24px;
    margin:auto;
    overflow:hidden;
    box-shadow:0 0 25px #0A84FF55;
}
.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}
h1{
    margin-top:18px;
    font-size:28px;
}
p{
    color:#A8B4C8;
    margin-top:10px;
    line-height:1.6;
}
#qrcode{
    margin:28px auto;
    background:white;
    padding:18px;
    border-radius:24px;
    display:inline-block;
}
.download{
    width:100%;
    margin-top:22px;
    padding:16px;
    border:none;
    border-radius:18px;
    background:#0A84FF;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}
.small{
    margin-top:18px;
    font-size:13px;
    color:#6E87A8;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">
<img src="logo.png" alt="Technical Center Morelia">
</div>

<h1>Technical Center Morelia</h1>

<p>Escanea para abrir nuestra página oficial y realizar tu pago o enviarnos tu comprobante.</p>

<div id="qrcode"></div>

<button class="download" onclick="downloadQR()">
Descargar QR PNG
</button>

<div class="small">
WhatsApp 443 192 2958
</div>

</div>

<script type="module">
import QRCode from "https://cdn.jsdelivr.net/npm/qrcode/+esm";

// ⚠️ Cambia esta URL cuando publiques la página.
const LANDING_URL="https://technicalcentermorelia.github.io";

window.LANDING_URL=LANDING_URL;

const canvas=document.createElement("canvas");

QRCode.toCanvas(canvas, LANDING_URL,{
    width:600,
    margin:2,
    color:{
        dark:"#000000",
        light:"#FFFFFF"
    }
});

document.getElementById("qrcode").appendChild(canvas);

window.downloadQR=function(){

    const a=document.createElement("a");

    a.download="QR-Technical-Center-Morelia.png";
    a.href=canvas.toDataURL("image/png");

    a.click();

}
</script>

</body>
</html>
